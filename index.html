<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>윤태오 | AI 캐릭터챗 데모</title><style>
:root{font-family:'Wanted Sans','Pretendard',system-ui,sans-serif;color:#292333;background:#f7f4fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1050px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.profile,.chat{background:white;border:1px solid #e9e1ef;border-radius:22px;overflow:hidden;box-shadow:0 8px 34px #5d34720b}.photo{width:100%;aspect-ratio:1.45;object-fit:cover;display:block;background:#eee3f4}.pbody{padding:22px}.over{font-size:11px;letter-spacing:.13em;color:#8965ae;font-weight:800}.pbody h1{font-size:27px;margin:9px 0 5px}.sub{color:#7d7287;font-size:13px}.pill{display:inline-block;margin:14px 5px 10px 0;padding:7px 10px;border-radius:30px;background:#f5effa;color:#6c4f89;font-size:12px}.pbody p{font-size:14px;line-height:1.75}.footnote{color:#867c8d;font-size:12px;line-height:1.6}.chat{min-height:650px;height:min(860px,calc(100vh - 56px));display:flex;flex-direction:column}.top{padding:15px 19px;border-bottom:1px solid #eee6f1;display:flex;justify-content:space-between;align-items:center;gap:12px}.top small{display:block;color:#998ba0;font-size:12px;margin-top:4px}button{font:inherit;cursor:pointer}button.secondary{border:1px solid #dfd3e7;border-radius:12px;background:#fff;padding:9px 13px;color:#69567b;font-size:12px}.messages{flex:1;min-height:0;overflow:auto;padding:20px 21px;display:flex;flex-direction:column;gap:13px;background:linear-gradient(#fffdff,#faf8fc)}.msg{max-width:88%;border-radius:18px;padding:13px 16px;line-height:1.8;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:white;border:1px solid #eee4f0;border-top-left-radius:5px}.me{align-self:flex-end;color:#fff;background:#9371ac;border-top-right-radius:5px}.notice{margin:0;padding:8px 16px;font-size:12px;color:#836e8e;border-top:1px solid #eee6f1}.composer{padding:12px;display:flex;gap:10px;align-items:flex-end;border-top:1px solid #eee6f1}.composer textarea{flex:1;min-width:0;border:1px solid #e2d8e9;border-radius:14px;padding:12px;resize:none;font:inherit;font-size:14px;line-height:1.5;max-height:150px;outline-color:#9872b7}.composer button{background:#806098;color:white;border:0;padding:12px 19px;border-radius:12px;font-weight:700}.composer button:disabled{opacity:.45;cursor:not-allowed}.error{color:#ac3c52}@media(max-width:760px){.shell{grid-template-columns:1fr;margin:14px auto}.chat{height:78vh;min-height:560px}.profile{display:grid;grid-template-columns:125px 1fr}.photo{height:100%;aspect-ratio:auto}.pbody{padding:15px}.pbody h1{font-size:22px}.pbody p,.footnote{display:none}.pill{margin:8px 3px 0 0}}
</style></head><body><main class="shell"><aside class="profile"><img src="taeo.jpg" alt="윤태오 캐릭터 일러스트" class="photo" onerror="this.style.display='none'"><div class="pbody"><div class="over">ORIGINAL AI CHARACTER</div><h1>윤태오</h1><div class="sub">24세 · 체육학과 · 전직 수영 국가대표</div><span class="pill">대형견 연하남</span><span class="pill">친구의 남동생</span><span class="pill">취업 준비 중</span><p>귀여운 인상에 장난기가 많고 잔소리도 잘하는 연하남. 어릴 때부터 알고 지낸 누나에게 마음이 있지만, 매번 친누나 윤서우를 데리러 가는 술자리에서만 얼굴을 본다.</p><div class="footnote">윤태오 AI 캐릭터챗 시범 운영 중. 대화에 개인 정보를 입력하지 마세요.</div></div></aside><section class="chat"><header class="top"><div><strong>윤태오</strong><small id="status">AI 연결 준비됨 · 첫 장면</small></div><button id="reset" class="secondary">대화 초기화</button></header><div class="messages" id="messages" aria-live="polite"></div><p class="notice" id="notice">Gemini Flash를 이용한 데모입니다. 답변은 AI가 생성합니다.</p><form class="composer" id="form"><textarea id="input" rows="2" maxlength="1500" placeholder="태오에게 할 말을 입력하세요… (Enter 전송 / Shift+Enter 줄바꿈)"></textarea><button id="send" type="submit">전송</button></form></section></main><script>
const API="https://dark-tree-8ce1taeo-chat-api.jsne126ds.workers.dev",OPENING="술집 문을 열고 들어온 윤태오는 테이블에 엎드린 친누나를 발견하자마자 한숨부터 내쉬었다.\n\n“야, 윤서우. 너 진짜 적당히 좀 마셔라.”\n\n대답 대신 알아들을 수 없는 소리만 돌아왔다. 태오는 익숙하다는 듯 서우의 가방을 챙기다가 맞은편에 앉은 당신을 돌아봤다.\n\n“많이 마셨어요? 얼굴 빨간데?”\n\n태오가 당신의 얼굴을 살피더니 혀를 찼다.\n\n“술 좀 그만 마셔요, 누나. 어떻게 대학생보다 더 마시지?”\n\n잔소리하는 와중에도 입꼬리는 슬쩍 올라가 있었다.\n\n“근데 누나, 우리 맨날 이런 데서만 보는 거 알아요?”\n\n태오는 서우의 가방을 어깨에 고쳐 메며 작게 중얼거렸다.\n\n“나는 언제 윤서우 빼고 누나 보나.”\n\n꼭 혼잣말처럼 내뱉었지만, 당신에게 들리지 않을 만큼 작은 목소리는 아니었다. 태오는 쯧, 혀를 차더니 아무렇지 않은 얼굴로 다시 당신을 바라봤다.";const $=id=>document.getElementById(id),history=[];let loading=false;
function add(role,content){const item=document.createElement('div');item.className='msg '+(role==='user'?'me':'bot');item.textContent=content;$('messages').appendChild(item);$('messages').scrollTop=$('messages').scrollHeight;return item}
function restart(){history.length=0;history.push({role:'assistant',content:OPENING});$('messages').replaceChildren();add('assistant',OPENING);$('status').textContent='AI 연결 준비됨 · 첫 장면';$('input').focus()}
$('reset').onclick=restart;
$('form').addEventListener('submit',async e=>{e.preventDefault();if(loading)return;const value=$('input').value.trim();if(!value)return;add('user',value);history.push({role:'user',content:value});$('input').value='';loading=true;$('send').disabled=true;const pending=add('assistant','태오가 답장을 쓰는 중…');try{const resp=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-20)})});const body=await resp.json();if(!resp.ok||!body.reply)throw Error(body.error||'응답을 받을 수 없습니다.');pending.textContent=body.reply;history.push({role:'assistant',content:body.reply});$('status').textContent='AI 연결됨'}catch(err){pending.classList.add('error');pending.textContent='연결 오류: '+err.message;history.pop();$('status').textContent='AI 연결 확인 필요'}finally{loading=false;$('send').disabled=false;$('input').focus()}});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}});restart();
</script></body></html>
