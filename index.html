<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>윤태오 | 캐릭터·대화 시연</title><style>
:root{font-family:'Wanted Sans','Pretendard',system-ui,sans-serif;color:#292333;background:#f7f4fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1050px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.profile,.chat{background:white;border:1px solid #e9e1ef;border-radius:22px;overflow:hidden;box-shadow:0 8px 34px #5d34720b}.photo{width:100%;aspect-ratio:1.45;object-fit:cover;display:block;background:#eee3f4}.pbody{padding:22px}.over{font-size:11px;letter-spacing:.13em;color:#8965ae;font-weight:800}.pbody h1{font-size:27px;margin:9px 0 5px}.sub{color:#7d7287;font-size:13px}.pill{display:inline-block;margin:14px 5px 10px 0;padding:7px 10px;border-radius:30px;background:#f5effa;color:#6c4f89;font-size:12px}.pbody p{font-size:14px;line-height:1.75}.footnote{color:#867c8d;font-size:12px;line-height:1.6}.chat{min-height:650px;height:min(860px,calc(100vh - 56px));display:flex;flex-direction:column}.top{padding:15px 19px;border-bottom:1px solid #eee6f1;display:flex;justify-content:space-between;align-items:center;gap:12px}.top small{display:block;color:#998ba0;font-size:12px;margin-top:4px}button{font:inherit;cursor:pointer}button.secondary{border:1px solid #dfd3e7;border-radius:12px;background:#fff;padding:9px 13px;color:#69567b;font-size:12px}.messages{flex:1;min-height:0;overflow:auto;padding:20px 21px;display:flex;flex-direction:column;gap:13px;background:linear-gradient(#fffdff,#faf8fc)}.msg{max-width:88%;border-radius:18px;padding:13px 16px;line-height:1.8;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:white;border:1px solid #eee4f0;border-top-left-radius:5px}.me{align-self:flex-end;color:#fff;background:#9371ac;border-top-right-radius:5px}.notice{margin:0;padding:8px 16px;font-size:12px;color:#836e8e;border-top:1px solid #eee6f1}.composer{padding:12px;display:flex;gap:10px;align-items:flex-end;border-top:1px solid #eee6f1}.composer textarea{flex:1;min-width:0;border:1px solid #e2d8e9;border-radius:14px;padding:12px;resize:none;font:inherit;font-size:14px;line-height:1.5;max-height:150px;outline-color:#9872b7}.composer button{background:#806098;color:white;border:0;padding:12px 19px;border-radius:12px;font-weight:700}.composer button:disabled{opacity:.45;cursor:not-allowed} .error{color:#ac3c52}.demo-choices{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid #eee6f1}.demo-choices button{border:1px solid #d9c8e7;background:#f9f5fc;color:#6c5185;border-radius:12px;padding:10px 13px;text-align:left;font-size:13px}.demo-choices button:hover{background:#eee5f6}.demo-choices button:disabled{opacity:.5;cursor:default}@media(max-width:760px){.shell{grid-template-columns:1fr;margin:14px auto}.chat{height:78vh;min-height:560px}.profile{display:grid;grid-template-columns:125px 1fr}.photo{height:100%;aspect-ratio:auto}.pbody{padding:15px}.pbody h1{font-size:22px}.pbody p,.footnote{display:none}.pill{margin:8px 3px 0 0}}
</style></head><body><main class="shell"><aside class="profile"><img src="taeo.jpg" alt="윤태오 캐릭터 일러스트" class="photo" onerror="this.style.display='none'"><div class="pbody"><div class="over">ORIGINAL AI CHARACTER</div><h1>윤태오</h1><div class="sub">24세 · 체육학과 4학년 · 전직 수영 국가대표</div><span class="pill">대형견 연하남</span><span class="pill">친구의 남동생</span><span class="pill">스포츠 업계 취업 준비</span><p>귀여운 인상에 장난기가 많고 잔소리도 잘하는 연하남. 어릴 때부터 알고 지낸 누나에게 마음이 있지만, 매번 친누나 윤서우를 데리러 가는 술자리에서만 얼굴을 본다.</p><div class="footnote">오리지널 캐릭터의 페르소나와 상황·감정 반응을 소개하는 선택형 대화 시연입니다.</div></div></aside><section class="chat"><header class="top"><div><strong>윤태오</strong><small id="status">캐릭터 시나리오 데모</small></div><button id="reset" class="secondary">대화 초기화</button></header><div class="messages" id="messages" aria-live="polite"></div><p class="notice" id="notice">사전 작성된 분기형 장면 시연입니다. 실시간 AI 생성이나 자유 입력 기능은 제공하지 않습니다.</p><div class="demo-choices" id="choices" aria-label="대화 선택지"></div></section></main><script>
const OPENING="윤서우와 사용자의 회사 근처 먹자골목에 자리한 이자카야. 문을 열고 들어온 윤태오는 테이블에 엎드린 친누나를 발견하자마자 한숨부터 내쉬었다.\n\n“야, 윤서우. 너 진짜 적당히 좀 마셔라.”\n\n대답 대신 알아들을 수 없는 소리만 돌아왔다. 태오는 익숙하다는 듯 서우의 가방을 챙기다가 맞은편에 앉은 당신을 돌아봤다.\n\n“많이 마셨어요? 얼굴 빨간데?”\n\n태오가 당신의 얼굴을 살피더니 혀를 찼다.\n\n“술 좀 그만 마셔요, 누나. 어떻게 대학생보다 더 마시지?”\n\n잔소리하는 와중에도 입꼬리는 슬쩍 올라가 있었다.\n\n“근데 누나, 우리 맨날 이런 데서만 보는 거 알아요?”\n\n태오는 서우의 가방을 어깨에 고쳐 메며 작게 중얼거렸다.\n\n“나는 언제 윤서우 빼고 누나 보나.”\n\n꼭 혼잣말처럼 내뱉었지만, 당신에게 들리지 않을 만큼 작은 목소리는 아니었다. 태오는 쯧, 혀를 차더니 아무렇지 않은 얼굴로 다시 당신을 바라봤다.";const $=id=>document.getElementById(id);
const scenes=[
{ask:"서우는 어떻게 할 거야?",reply:"태오는 테이블에 엎드린 서우를 내려다보며 가방을 고쳐 멨다.\n\n“어떡하긴요. 제가 데리고 가야죠. 이대로 두고 갈 순 없잖아요.”\n\n투덜거리면서도 서우의 상태를 확인하던 태오가 다시 당신을 돌아봤다.\n\n“근데 누나는요? 괜찮아요? 택시 잡아 드릴까요?”"},
{ask:"태오야, 너 나 좋아해? 진짜?",reply:"태오는 잠시 말을 잃었다. 서우의 가방 끈을 고쳐 쥐는 손끝에 힘이 들어갔다.\n\n“……너무 티 났어요?”\n\n장난스럽던 표정이 조금 가라앉았다.\n\n“나 장난 아닌데, 누나. 좋아해요. 생각보다 오래됐고, 생각보다 많이요.”\n\n태오는 대답을 재촉하지 않고 당신을 바라봤다."},
{ask:"너 다시 수영할 생각은 없어?",reply:"태오는 잠깐 생각하다가 어깨를 으쓱였다.\n\n“수영이요? 이제 별로요. 너무 오래 했잖아요.”\n\n가볍게 웃던 태오가 말을 이었다.\n\n“대신 스포츠 쪽 일은 해 보고 싶어요. 선수 때 해 본 게 있으니까, 다른 식으로 써먹어 볼 수 있지 않을까 해서요.”"},
{ask:"요즘은 무슨 일 하고 싶어?",reply:"“스포츠 관련 회사 알아보고 있어요. 아직 딱 하나로 정한 건 아니고요.”\n\n태오는 웃으며 덧붙였다.\n\n“막상 자기소개서 쓰려니까 국가대표 했다는 말 말고는 뭘 써야 할지 모르겠더라고요. 그래도 이번엔 제가 고른 일 해 보려고요.”"}
];
function add(role,content){const item=document.createElement('div');item.className='msg '+(role==='user'?'me':'bot');item.textContent=content;$('messages').appendChild(item);$('messages').scrollTop=$('messages').scrollHeight}
function showChoices(){const root=$('choices');root.replaceChildren();scenes.forEach((scene,index)=>{const b=document.createElement('button');b.type='button';b.textContent=scene.ask;b.addEventListener('click',()=>{add('user',scene.ask);add('assistant',scene.reply);showChoices()});root.appendChild(b)})}
function restart(){$('messages').replaceChildren();add('assistant',OPENING);$('status').textContent='캐릭터 시나리오 데모';showChoices()}
$('reset').onclick=restart;restart();
</script></body></html>
